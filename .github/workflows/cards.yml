name: Refresh profile cards

on:
  schedule:
    - cron: "23 7 * * *" # daily, 07:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render_cards.py", "fonts/**"]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render README cards
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
